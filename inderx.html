<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>南华青年领袖证书 · QR Code</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --gold: #C8973A;
    --gold-light: #E8B84B;
    --dark: #1A1A2E;
    --deep: #16213E;
    --text: #F0EAD6;
    --muted: #A89B7A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Georgia', 'STSong', 'SimSun', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .card {
    background: var(--deep);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 40px 48px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 0 40px rgba(200,151,58,0.2);
  }
  .school-name {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .title {
    font-size: 22px;
    color: var(--gold-light);
    margin-bottom: 4px;
    font-weight: normal;
  }
  .subtitle {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1.5px;
    margin-bottom: 32px;
  }
  .divider {
    border: none;
    border-top: 1px solid rgba(200,151,58,0.3);
    margin: 24px 0;
  }
  #qrcode {
    display: flex;
    justify-content: center;
    margin: 0 auto 24px;
  }
  #qrcode canvas, #qrcode img {
    border-radius: 8px;
    border: 3px solid var(--gold);
    padding: 10px;
    background: #fff;
  }
  .scan-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 12px;
  }
  .url-text {
    font-size: 11px;
    color: rgba(200,151,58,0.6);
    word-break: break-all;
    font-family: monospace;
  }
  .badge {
    display: inline-block;
    margin-top: 20px;
    padding: 4px 14px;
    border: 1px solid rgba(200,151,58,0.4);
    border-radius: 20px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  /* Print styles */
  @media print {
    body { background: #fff; }
    .card {
      background: #fff;
      border-color: #888;
      box-shadow: none;
      color: #111;
    }
    .school-name, .subtitle, .scan-label, .url-text, .badge { color: #555; }
    .title { color: #8B6914; }
    #qrcode canvas, #qrcode img {
      border-color: #888;
    }
  }
</style>
</head>
<body>
<div class="card">
  <div class="school-name">Nan Hwa High School</div>
  <div class="title">南华青年领袖证书</div>
  <div class="subtitle">Young Leadership Certificate · Digital Authentication</div>
  <hr class="divider">
  <div id="qrcode"></div>
  <div class="scan-label">扫描二维码 · Scan to Verify</div>
  <div class="url-text">https://nanhwappd.github.io/nanhwa-leadership/</div>
  <div class="badge">南华独中 · 2024–2026</div>
</div>

<script>
  new QRCode(document.getElementById("qrcode"), {
    text: "https://nanhwappd.github.io/nanhwa-leadership/",
    width: 220,
    height: 220,
    colorDark: "#1A1A2E",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>
</body>
</html>
